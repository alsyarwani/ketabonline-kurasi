<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block judul %}Katalog ketabonline{% endblock %}</title>
<style>
  :root { --tepi:#d9d6cf; --latar:#faf9f6; --teks:#22201c; --redup:#6b665c; --aksen:#1f5f4a; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--teks); background:var(--latar); }
  header { padding:12px 20px; border-bottom:1px solid var(--tepi); background:#fff; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header a { color:var(--aksen); text-decoration:none; }
  main { padding:16px 20px; }
  .ar { font-family:"Amiri","Noto Naskh Arabic","Geeza Pro",serif; font-size:16px; direction:rtl; unicode-bidi:plaintext; }
  table { border-collapse:collapse; width:100%; background:#fff; }
  th, td { border:1px solid var(--tepi); padding:5px 7px; vertical-align:top; text-align:start; }
  th { background:#f1efe9; font-weight:600; white-space:nowrap; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .kecil { font-size:12px; color:var(--redup); }
  .lencana { display:inline-block; padding:1px 7px; border-radius:9px; font-size:12px; white-space:nowrap; }
  .st-baru { background:#dcefe5; color:#14532d; } .st-mirip { background:#fbefd5; color:#7a4b00; }
  .st-golden { background:#e3e8f7; color:#1e3a8a; } .st-syamilah4 { background:#eee; color:#444; }
  form.saring { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-bottom:12px; }
  form.saring label { display:flex; flex-direction:column; font-size:12px; color:var(--redup); gap:2px; }
  input, select, button { font:inherit; padding:5px 7px; border:1px solid var(--tepi); border-radius:5px; background:#fff; }
  button, .tombol { background:var(--aksen); color:#fff; border-color:var(--aksen); cursor:pointer; text-decoration:none; padding:5px 10px; border-radius:5px; }
  .tombol.lain { background:#fff; color:var(--aksen); }
  .halaman { margin:12px 0; display:flex; gap:10px; align-items:center; }
  .ringkas td, .ringkas th { padding:3px 8px; }
  a { color:var(--aksen); }
  pre { white-space:pre-wrap; background:#fff; border:1px solid var(--tepi); padding:10px; max-height:520px; overflow:auto; font-size:12px; }
  details { margin:12px 0; }
</style>
</head>
<body>
<header>
  <h1><a href="{{ url_for('beranda') }}">Katalog ketabonline</a></h1>
  <span class="kecil">pencocokan dengan Syamilah 4 &amp; GoldenShamela · hanya baca</span>
</header>
<main>{% block isi %}{% endblock %}</main>
</body>
</html>
